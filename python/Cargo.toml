[package]
name = "binaryornot-rs-python"
version = "0.6.0"
edition = "2021"
rust-version = "1.70"
description = "Python bindings for binaryornot-rs via PyO3."
license = "MIT"
authors = [
    "Audrey Roy Greenfeld <aroy@alum.mit.edu>",
    "opticsWolf <opticswolf@protonmail.com>",
]
repository = "https://github.com/opticsWolf/binaryornot-rs"
publish = false

[lib]
name = "binaryornot_rs"
path = "src/pyo3.rs"
crate-type = ["cdylib"]

[dependencies]
binaryornot-rs = { path = ".." }
pyo3 = { version = "0.28", features = ["extension-module"] }

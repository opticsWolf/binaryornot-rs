[package]
name = "binaryornot-rs"
version = "0.6.0"
edition = "2021"
rust-version = "1.70"
description = "Ultra-lightweight Rust library and CLI to check if a file is binary or text."
readme = "README.md"
license = "MIT"
authors = [
    "Audrey Roy Greenfeld <aroy@alum.mit.edu>",
    "opticsWolf <opticswolf@protonmail.com>",
]
repository = "https://github.com/opticsWolf/binaryornot-rs"
keywords = ["binary", "text", "detection", "file", "encoding"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "binaryornot"
path = "src/main.rs"

[lib]
name = "binaryornot_rs"
path = "src/lib.rs"

[dependencies]
encoding_rs = "0.8"

[dev-dependencies]
tempfile = "3"
